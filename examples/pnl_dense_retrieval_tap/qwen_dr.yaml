### model
model_name_or_path: Qwen2.5
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: full
deepspeed: /app/examples/deepspeed/ds_z2_config.json  # choices: [ds_z0_config.json, ds_z2_config.json, ds_z3_config.json]

# dense retrieval
model_use_pnl_dense_retrieval: false
pnl_dense_retrieval: false
use_dense_retrieval_tap: true 
model_use_dense_retrieval_tap: true 

### dataset
dataset: train_dataset
template: dynamic
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 32
dataloader_num_workers: 0

### output
output_dir: saves/
logging_steps: 200
save_steps: 8000
plot_loss: true
overwrite_output_dir: true
save_only_model: false

### train
preprocessing_batch_size: 1000
per_device_train_batch_size: 24
gradient_accumulation_steps: 1
learning_rate: 5.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null
flash_attn: auto

